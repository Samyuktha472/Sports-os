<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="/manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sports OS - Manage Roster</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/sidebar.css?v=3">
    <link rel="stylesheet" href="../css/roster.css">
</head>

<body>
    <div id="sidebar"></div>

    <div class="main-content">
        <header class="page-header">
            <div>
                <p class="page-meta">ROSTER MANAGEMENT</p>
                <h1 class="page-title">Manage Roster</h1>
                <p class="page-subtitle">Add, edit and remove athletes and coaches for your academy.</p>
            </div>
        </header>

        <div class="roster-tabs">
            <button class="tab-btn active" data-tab="athletes">🏃 Athletes</button>
            <button class="tab-btn" data-tab="coaches">🧑‍🏫 Coaches</button>
            <button class="tab-btn" data-tab="createbatch">🗂️ Create Batch</button>
        </div>

        <!-- Athletes Tab -->
        <div class="tab-panel active" id="tab-athletes">
            <div class="roster-toolbar">
                <input type="text" id="athleteSearch" placeholder="Search athletes…">
                <button class="btn-primary" id="addAthleteBtn">+ Add Athlete</button>
            </div>
            <div class="roster-table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Specialization</th>
                            <th>Phone</th>
                            <th>Batch</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="athleteTableBody">
                        <tr>
                            <td colspan="6" class="empty-state">Loading…</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Coaches Tab -->
        <div class="tab-panel" id="tab-coaches">
            <div class="roster-toolbar">
                <input type="text" id="coachSearch" placeholder="Search coaches…">
                <button class="btn-primary" id="addCoachBtn">+ Add Coach</button>
            </div>
            <div class="roster-table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Specialization</th>
                            <th>Phone</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="coachTableBody">
                        <tr>
                            <td colspan="6" class="empty-state">Loading…</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Create Batch Tab -->
        <div class="tab-panel" id="tab-createbatch">
            <div class="batch-form-card">
                <h2 style="margin:0 0 20px;font-size:18px;" id="batchFormTitle">Create New Batch</h2>

                <div class="form-row">
                    <label>Batch Name *</label>
                    <input type="text" id="b_name" placeholder="e.g. U-16 Boys">
                </div>

                <div class="form-row" id="headCoachFieldWrap" style="display:none;">
                    <label>Head Coach *</label>
                    <select id="b_headCoach">
                        <option value="">Select head coach</option>
                    </select>
                </div>

                <div class="form-row" id="coachesFieldWrap" style="display:none;">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
                        <label style="margin:0;">Coaches</label>
                        <button type="button" class="btn-icon" id="quickAddCoachBtn">+ Add Coach</button>
                    </div>
                    <div class="checkbox-list" id="b_coachesList"></div>
                </div>

                <div class="form-row">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
                        <label style="margin:0;">Athletes</label>
                        <button type="button" class="btn-icon" id="quickAddAthleteBtn">+ Add Athlete</button>
                    </div>
                    <div class="checkbox-list" id="b_athletesList"></div>
                </div>

                <div class="modal-actions" style="margin-top:8px;">
                    <button class="btn-cancel" id="batchCancelEditBtn" style="display:none;">Cancel Edit</button>
                    <button class="btn-save" id="batchSaveBtn">Create Batch</button>
                </div>
            </div>

            <div class="roster-table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Batch Name</th>
                            <th>Head Coach</th>
                            <th>Coaches</th>
                            <th>Athletes</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="batchTableBody">
                        <tr>
                            <td colspan="5" class="empty-state">Loading…</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Athlete Modal -->
    <div class="modal-backdrop" id="athleteModal">
        <div class="modal">
            <h2 id="athleteModalTitle">Add Athlete</h2>
            <div class="form-grid">
                <div class="form-row">
                    <label>Full Name *</label>
                    <input type="text" id="a_name" placeholder="Ravi Kumar">
                </div>
                <div class="form-row">
                    <label>Email *</label>
                    <input type="email" id="a_email" placeholder="ravi@example.com">
                </div>
                <div class="form-row">
                    <label>Password *</label>
                    <input type="password" id="a_password" placeholder="Min 6 characters">
                    <small class="field-error" id="a_password_error"></small>
                </div>
                <div class="form-row">
                    <label>Phone</label>
                    <input type="text" id="a_phone" placeholder="9876543210">
                    <small class="field-error" id="a_phone_error"></small>
                </div>
                <div class="form-row">
                    <label>Specialization</label>
                    <input type="text" id="a_specialization" placeholder="Raider / Batsman / etc.">
                </div>
                <div class="form-row">
                    <label>Date of Birth</label>
                    <input type="date" id="a_dob">
                </div>
            </div>
            <div class="form-row">
                <label>Batch Assigned (optional)</label>
                <input type="text" id="a_batch" placeholder="e.g. U-16 Batch A">
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" id="athleteModalCancel">Cancel</button>
                <button class="btn-save" id="athleteModalSave">Save</button>
            </div>
        </div>
    </div>

    <!-- Coach Modal -->
    <div class="modal-backdrop" id="coachModal">
        <div class="modal">
            <h2 id="coachModalTitle">Add Coach</h2>
            <div class="form-grid">
                <div class="form-row">
                    <label>Full Name *</label>
                    <input type="text" id="c_name" placeholder="Anil Kumble">
                </div>
                <div class="form-row">
                    <label>Email *</label>
                    <input type="email" id="c_email" placeholder="anil@example.com">
                </div>
                <div class="form-row">
                    <label>Password *</label>
                    <input type="password" id="c_password" placeholder="Min 6 characters">
                    <small class="field-error" id="c_password_error"></small>
                </div>
                <div class="form-row">
                    <label>Role *</label>
                    <select id="c_role">
                        <option value="coach">Coach</option>
                        <option value="head_coach">Head Coach</option>
                    </select>
                </div>
                <div class="form-row">
                    <label>Specialization</label>
                    <input type="text" id="c_specialization" placeholder="Bowling / Defending / etc.">
                </div>
                <div class="form-row">
                    <label>Phone</label>
                    <input type="text" id="c_phone" placeholder="9876543210">
                    <small class="field-error" id="c_phone_error"></small>
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn-cancel" id="coachModalCancel">Cancel</button>
                <button class="btn-save" id="coachModalSave">Save</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="../js/sidebar.js?v=4"></script>
    <script src="../js/notifications.js"></script>
    <script src="../js/roster.js"></script>
    <script>
        (function () {
            const allowedRoles = ['owner', 'head_coach', 'coach'];
            const user = JSON.parse(localStorage.getItem('user') || 'null');
            const role = user?.role;
            if (!user || !role) {
                window.location.href = 'login.html';
                return;
            }
            if (!allowedRoles.includes(role)) {
                window.location.href = role === 'athlete' ? 'performance.html' : 'dashboard.html';
            }
        })();
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js')
                .then(() => console.log('SW registered'))
                .catch(err => console.log('SW failed:', err));
        }
    </script>
</body>

</html>
